name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        run: |
          unzip -q -o ZeroAI-forge-1.21.1.zip
          D=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          cd "$D"
          ok=0
          for i in 1 2 3 4 5 6; do
            if [ "$i" = "1" ]; then FLAG="--offline"; else FLAG="--refresh-dependencies"; fi
            if gradle build --no-daemon $FLAG; then ok=1; break; fi
            echo "Percobaan $i gagal, tunggu 20 detik..."
            sleep 20
          done
          [ "$ok" = "1" ]
      - uses: actions/upload-artifact@v4
        with:
          name: zeroai-jar
          path: "**/build/libs/*.jar"
