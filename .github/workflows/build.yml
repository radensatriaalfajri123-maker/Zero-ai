name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ZeroAI-forge-1.21.1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - run: gradle build --no-daemon
        working-directory: zeroai
      - uses: actions/upload-artifact@v4
        with:
          name: zeroai-jar
          path: zeroai/build/libs/*.jar
