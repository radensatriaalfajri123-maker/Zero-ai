name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        run: |
          unzip -q -o ZeroAI-forge-1.21.1.zip
          D=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "Project di: $D"
          cd "$D"
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: zeroai-jar
          path: "**/build/libs/*.jar"
